# Environnement de développement local — PostgreSQL 16
# (même moteur qu'en production sur Render)
#
#   docker compose up -d db
#   php artisan migrate --seed
#
# Les identifiants correspondent au .env.example livré.
# Base de test des tests automatisés : stive_clothing_test (créée ci-dessous).
services:
  db:
    image: postgres:16-alpine
    container_name: stive-db
    restart: unless-stopped
    environment:
      POSTGRES_DATABASE: stive_clothing
      POSTGRES_USER: stive
      POSTGRES_PASSWORD: secret
      TZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
    ports:
      - "5432:5432"
    volumes:
      - stive-pgdata:/var/lib/postgresql/data
      # Crée la base utilisée par `php artisan test` au premier démarrage.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stive -d stive_clothing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stive-pgdata:
