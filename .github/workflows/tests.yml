name: Tests

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    name: PHP 8.3 · MySQL 8.4
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stive_clothing_test
          MYSQL_USER: stive
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ustive -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd, mbstring, bcmath, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      # La CI ne dispose que de la base de test : on prépare la base de
      # développement pour valider migrations, seeders et diagnostic.
      - name: Préparer la base de développement
        run: |
          mysql -h 127.0.0.1 -ustive -psecret -e \
            "CREATE DATABASE IF NOT EXISTS stive_clothing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php artisan migrate --seed --force

      - name: Diagnostic de l'environnement
        run: php artisan stive:check-setup 2>&1 | tee /tmp/setup.log

      - name: Style (Pint)
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Tests
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/tests.log
          rc=$?
          exit "$rc"

      # Diagnostic : en cas d'échec, le journal des tests est publié en
      # commentaire de commit pour être consultable sans accès aux journaux
      # d'Actions.
      - name: Publier le journal des tests en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Échec de la CI — extrait des journaux"
            echo '```'
            echo "--- diagnostic ---"
            tail -c 3000 /tmp/setup.log 2>/dev/null || echo "(aucun journal de diagnostic)"
            echo "--- tests ---"
            tail -c 4000 /tmp/tests.log 2>/dev/null || echo "(aucun journal de tests)"
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/comment.md || true
