name: Tests

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    name: PHP 8.3 · MySQL 8.4
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stive_clothing_test
          MYSQL_USER: stive
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ustive -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd, mbstring, bcmath, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Tests
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/tests.log
          rc=$?
          exit "$rc"

      # Diagnostic : en cas d'échec, le journal des tests est publié en
      # commentaire de commit pour être consultable sans accès aux journaux
      # d'Actions.
      - name: Publier le journal des tests en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Échec des tests — extrait du journal"
            echo '```'
            tail -c 6000 /tmp/tests.log 2>/dev/null || echo "(journal indisponible)"
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/comment.md || true
